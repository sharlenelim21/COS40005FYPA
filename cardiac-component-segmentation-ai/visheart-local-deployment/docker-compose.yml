# Docker Compose for LOCAL Deployment - Combined Container Version

x-gpu-environment: &gpu-env
  JWT_SECRET: dev-gpu-secret
  YOLO_MODEL_NAME: 24April2025-single-stage-usethis.pt
  MEDSAM_MODEL_NAME: medsam_vit_b.pth
  FOURD_RECONSTRUCTION_MODEL_NAME: fourd_model_epoch_250.pth
  GPU_ACCESS_SECRET: HMYNJC4IJESDY25BAIUPB43ZS3GDNXMPDOKQW24IL4Z5T2U3KOZBP43GEJLZHY75
  SERVER_USERNAME: visheart-gpu-inference
  ALLOWED_NODE_USERNAME: visheart-node-server
  ENV_TYPE: development
  GPU_SEMAPHORE_COUNT: 3
  RECONSTRUCTION_USE_FIXED_SEED: "true"
  RECONSTRUCTION_RANDOM_SEED: "42"
  LANDMARK_REPO_PATH: /app/UNETRESNET34
  LANDMARK_MODEL_2CH_PATH: /app/UNETRESNET34/checkpoints/best_model_2ch.pth
  LANDMARK_MODEL_1CH_PATH: /app/UNETRESNET34/checkpoints/best_model_1ch.pth

services:
  # ============================================
  # Combined VisHeart Application
  # Frontend (Next.js) + Backend (Node.js)
  # ============================================
  visheart-app:
    image: sharlene21/visheart-local:1.1.0
    container_name: visheart-local
    restart: unless-stopped
    ports:
      - "3000:3000"  # Frontend
      - "5000:5000"  # Backend API
    environment:
      # ========== Backend Configuration ==========
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5000
      
      # MongoDB Configuration
      MONGODB_URI: mongodb://admin:P%40ssw0rd123%21@mongodb:27017/visheart?authSource=admin
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Session Configuration
      SESSION_SECRET: LOCAL-SESSION-SECRET-CHANGE-IN-PRODUCTION-12345
      SESSION_NAME: visheart.sid
      SESSION_MAX_AGE: 86400000
      
      # S3/MinIO Configuration
      STORAGE_MODE: s3
      AWS_BUCKET_NAME: visheart-bucket
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
      
      # GPU Service Configuration
      # The inference service runs as `gpu-cpu` or `gpu-nvidia` in this
      # same compose file. Both share the docker-network alias `gpu`.
      # The prebuilt image `sveltes/visheart-inference-gpu:faithful-latest`
      # bakes a copy of start_server.py that binds uvicorn on **port
      # 8001**, so the backend addresses it at http://gpu:8001. (The
      # local source's start_server.py uses 8011, but that file is not
      # what the prebuilt image runs.) If you ever rebuild the GPU image
      # from local source, update this port + the gpu-* services'
      # `ports:` mapping in lockstep.
      GPU_API_URL: http://gpu:8001
      LOCAL_GPU_API_URL: http://gpu:8001
      MEDSAM_USE_LOCALHOST: "true"
      MEDSAM_LOCAL_BASE_URL: http://gpu:8001
      GPU_JWT_SECRET: dev-gpu-secret
      GPU_SERVER_URL: gpu
      GPU_SERVER_PORT: 8001
      GPU_SERVER_SSL: "false"
      GPU_SERVER_AUTH_JWT_SECRET: dev-gpu-secret
      GPU_SERVER_ID_FOR_GPU_SERVER: visheart-node
      GPU_SERVER_IDENTITY: visheart-gpu
      GPU_SERVER_JWT_REFRESH_INTERVAL: 480000
      GPU_SERVER_JWT_LIFETIME_SECONDS: 600

      # Callback URL Configuration
      # GPU container calls back to the backend; host.docker.internal:5000
      # is the host-side port mapping for the visheart-local container.
      CALLBACK_URL: http://host.docker.internal:5000
      LOCAL_CALLBACK_URL: http://visheart-app:5000
      
      # ========== Frontend Configuration ==========
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_ENV: development
      NEXT_PUBLIC_LANDMARK_USE_STUB: "false"
      NEXT_PUBLIC_LANDMARK_ENDPOINT: /landmark-detection
      ADMIN_SUPPORT_EMAIL: "meiqiliew334@gmail.com"
      SMTP_FROM: meiqiliew334@gmail.com
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: "meiqiliew334@gmail.com"
      SMTP_PASS: "ekqd vdiq bvwg kldk"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      #gpu:
      #  condition: service_started
      # GPU dependency removed so profiles can boot dynamically without crashing
    volumes:
      - backend_temp_jpeg:/app/backend/dist/temp_jpeg
      - backend_temp_exports:/app/backend/dist/temp_exports
      - backend_temp_mesh:/app/backend/dist/temp_mesh
      - backend_temp_upload:/app/backend/dist/temp_upload
    networks:
      - visheart-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/", "&&", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # MongoDB Database
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: visheart-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: P@ssw0rd123!
      MONGO_INITDB_DATABASE: visheart
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - visheart-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"admin\" -p \"P@ssw0rd123!\" --authenticationDatabase admin --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # ============================================
  # Redis Cache & Session Store
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: visheart-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - visheart-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # MinIO Object Storage (S3-compatible)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: visheart-minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - visheart-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================
  # MinIO Bucket Setup
  # ============================================
  minio-setup:
    image: minio/mc:latest
    container_name: visheart-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/visheart-bucket --ignore-existing;
      mc anonymous set download myminio/visheart-bucket;
      exit 0;
      "
    networks:
      - visheart-network

  # ============================================
  # GPU Inference Service (PROFILE: CPU)
  # ============================================
  gpu-cpu:
    image: sharlene21/visheart-gpu:latest
    container_name: visheart-gpu-cpu
    profiles: ["cpu"]
    restart: unless-stopped
    ports:
      # The prebuilt image's start_server.py binds uvicorn on port 8001.
      # If you rebuild the GPU image from local source (which uses 8011),
      # bump both this mapping and the visheart-app env block in lockstep.
      - "8001:8001"
    environment:
      <<: *gpu-env
      USE_GPU: "false"
      SKIP_MEDSAM_MODEL_LOAD: "true"
      VISHEART_DEVICE: "cpu"
    command: >
      bash -lc 'python -c "import nibabel, timm" ||
      pip install --no-cache-dir "nibabel>=5.0.0" timm;
      exec bash ./docker/scripts/start.sh'
    networks:
      visheart-network:
        aliases:
          - gpu

  # ============================================
  # GPU Inference Service (PROFILE: NVIDIA)
  # ============================================
  gpu-nvidia:
    image: sharlene21/visheart-gpu:latest
    container_name: visheart-gpu-nvidia
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      # See gpu-cpu service for the 8001-vs-8011 explanation.
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *gpu-env
      USE_GPU: "true"
      UNET_INFERENCE_SCRIPT_PATH: /app/app/external_unet_inference.py
    command: >
      bash -lc 'python -c "import nibabel, timm" ||
      pip install --no-cache-dir "nibabel>=5.0.0" timm;
      exec bash ./docker/scripts/start.sh'
    networks:
      visheart-network:
        aliases:
          - gpu

networks:
  visheart-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  backend_temp_jpeg:
    driver: local
  backend_temp_exports:
    driver: local
  backend_temp_mesh:
    driver: local
  backend_temp_upload:
    driver: local
